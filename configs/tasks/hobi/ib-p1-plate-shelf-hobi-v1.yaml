task_id: ib-p1-plate-shelf-hobi-v1
description: 'Plate lies flat on the table beside a shelf. Both arms have identical
  parallel-jaw grippers. One arm presses the plate''s rim down so it tilts; the
  other grasps the raised rim, lifts the plate alone and inserts it on edge into
  the center shelf slot.

  '
max_episode_steps: 10000
reward_type: sparse
action_mode: cartesian_delta
control_freq: 100

# ── Scene ──────────────────────────────────────────────────────────
scene:
  table:
    height: 0.9
    full_size: [1.0, 0.75, 0.05]
    offset: null
  robot_offset: null
  robot_rotation_z: [-90,90]
  object_color: null                   # base payload RGBA; null = use mesh texture
  table_color: [1.0, 1.0, 1.0, 1.0]   # base table-top RGBA (white)

task_conditions:
  success: {}
  failure:
    floor_drop_below: 0.05

# ── Domain randomization (re-sampled every reset) ─────────────────
# Physics axes (mass/friction) apply only with BOTH enabled: true AND a
# range; ranges use [min, max] uniform sampling.
randomization:
  # ── Physics ──
  payload_mass:                        # payload body mass (kg)
    enabled: true
    # range: [0.05, 0.20]
  payload_friction:                    # payload sliding friction
    enabled: true
    # range: [0.2, 0.8]
  table_friction:                      # table surface sliding friction
    enabled: true
    # range: [0.5, 1.5]
  # ── Placement ──
  payload_placement:                   # Gaussian jitter on payload start position
    enabled: true
    x_std: 0.1                        # std dev in meters for x-axis
    y_std: 0.1                        # std dev in meters for y-axis
  # ── Visual ──
  object_color:                        # randomize payload RGBA each reset
    enabled: false
  table_color:                         # randomize table-top RGBA each reset
    enabled: false
  lighting:
    position: true                     # randomize light position each reset
    color: false                       # randomize light diffuse/ambient color
  # ── Dynamics ──
  action_noise:                        # Gaussian noise on commanded actions
    enabled: false
    # std: 0.01
  observation_noise:                   # Gaussian noise on proprio observations
    enabled: false
    # std: 0.005

recording:
  save_freq:
    proprio: 100
    force_torque: 50
    object_state: 50
    cameras: 25
    tactile: 50
  save:
    action: true
    reward: true
    task_score: true
    joint_positions: true
    ee_poses: true
payload: plate
fixture: shelf
grippers:
- PandaGripper
- PandaGripper
controller:
- type: IK_POSE
  robot: Panda
  ik_pos_limit: 1.0      # large: disable direction-only clip; use linear scaling below
  ik_ori_limit: 1.0
  input_type: absolute
  impedance_mode: fixed
  kp: 10000
  damping_ratio: 1
  kp_limits: [0, 100000]
- type: IK_POSE
  robot: Panda
  ik_pos_limit: 1.0
  ik_ori_limit: 1.0
  input_type: absolute
  impedance_mode: fixed
  kp: 10000
  damping_ratio: 1
  kp_limits: [0, 100000]

# IK input scaling: action ∈ [-1, 1] → cartesian delta per control step.
# Final per-step motion = action * user_sensitivity. At control_freq=100 Hz,
# max cartesian speed ≈ user_sensitivity * 100 m/s (for full-magnitude action).
ik_scale:
  pos_sensitivity: 0.005 #5 mm target step per unit action (IK integrates the target) → 0.5 m/s max at control_freq=100
  ori_sensitivity: 0.01    # ~0.6° per unit action → ~60°/s max
obs:
  proprio:
    enabled: true
    keys:
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
    - robot0_joint_pos
    - robot0_joint_vel
    - robot1_eef_pos
    - robot1_eef_quat
    - robot1_gripper_qpos
    - robot1_joint_pos
    - robot1_joint_vel
    save: true
  object_state:
    enabled: true
    save: true
  cameras:
    gripper0_cam:
      enabled: true
      robosuite_name: robot0_eye_in_hand
      width: 640
      height: 480
      depth: false
      save: true
    gripper1_cam:
      enabled: true
      robosuite_name: robot1_eye_in_hand
      width: 640
      height: 480
      depth: false
      save: true
    exo_bird_cam:
      enabled: true
      robosuite_name: birdview
      width: 640
      height: 480
      depth: false
      save: true
    agent_cam:
      enabled: true
      robosuite_name: agentview
      width: 640
      height: 480
      depth: false
      save: true
  force_torque:
    enabled: true
    keys:
    - robot0_ft_sensor
    - robot1_ft_sensor
    save: true
  tactile:
    enabled: true
    fingers:
    - right
    - left
    rows: 8
    cols: 8
    spacing: 0.001
    save: true
