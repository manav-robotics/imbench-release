task_id: ib-p7-shape-stack-v1
description: >-
  Puzzle: stack a randomly chosen set of differently-shaped objects so
  that only one remains on the table, held stable.
max_episode_steps: 3000
reward_type: sparse
action_mode: cartesian_delta
control_freq: 100

# ── Physics ────────────────────────────────────────────────────────
physics:
  # Multi-point convex contacts: a flat cylinder or mesh face otherwise
  # rests on one contact and rocks, creeps or sinks into its support.
  multiccd: true

scene:
  table:
    full_size: [0.5, 0.5, 0.05]
    height: 0.8
    offset: null
  robot_offset: null

placement:
  center: null
  x_range: 0.17
  y_range: 0.17
  # Minimum spacing (metres) added on top of r_i + r_j between any two
  # spawned objects. Rejection sampler retries up to spawn_max_attempts
  # per object before falling back to an evenly-spaced ring.
  # Sized so the Panda's open-jaw spread (~8 cm) plus finger thickness
  # clears a neighbouring object's footprint when descending — without
  # this the gripper grazes adjacent objects on approach.
  spawn_margin: 0.06
  spawn_max_attempts: 400

randomization:
  lighting:
    position: true
    color: false
  num_objects:
    # Catalogue holds 5 archetypes, but {hex_prism, cone_frustum} are
    # mutually exclusive. With 3 non-group archetypes + at most 1 from
    # that group, a draw of 5 is clamped to the effective max of 4.
    range: [3, 5]

task:
  stable_steps: 100

task_conditions:
  success:
    score_threshold: 1.0
  failure:
    floor_z_threshold: 0.05

recording:
  save_freq:
    proprio: 100
    force_torque: 50
    object_state: 50
    cameras: 25
    tactile: 50
  save:
    action: true
    reward: true
    task_score: true
    joint_positions: true
    ee_poses: true

controller:
  type: OSC_POSE
  robot: Panda
  kp: 200
  damping_ratio: 1
  impedance_mode: fixed
  uncouple_pos_ori: true
  input_type: delta
  input_ref_frame: base

obs:
  proprio:
    enabled: true
    keys:
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
    - robot0_joint_pos
    - robot0_joint_vel
    save: true
  object_state:
    enabled: true
    save: true
  cameras:
    gripper_cam:
      enabled: true
      robosuite_name: robot0_eye_in_hand
      width: 640
      height: 480
      depth: false
      save: true
    ego_cam:
      enabled: true
      robosuite_name: robot0_robotview
      width: 640
      height: 480
      depth: false
      save: true
  force_torque:
    enabled: true
    keys:
    - robot0_ft_sensor
    save: true
  tactile:
    enabled: true
    fingers:
    - right
    - left
    rows: 8
    cols: 8
    spacing: 0.001
    save: true
