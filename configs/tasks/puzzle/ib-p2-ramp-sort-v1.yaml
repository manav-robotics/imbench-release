task_id: ib-p2-ramp-sort-v1
description: >-
  Puzzle: release blue and red balls on a ramp so each rolls into the bin of its colour.
max_episode_steps: 10000  # the scripted policy needs up to ~7600 steps for 5 balls
reward_type: sparse
action_mode: cartesian_delta
control_freq: 100

scene:
  table:
    full_size: [0.7, 0.8, 0.05]   # 0.8 m in y keeps the yaw-jittered layout (spawn box to fence) on the table
    height: 0.8
    offset: null
  robot_offset: null

# Initial placement sampler (read by SingleArmBase); reset() then places
# every object explicitly.
placement:
  center: null
  x_range: 0.12
  y_range: 0.12

randomization:
  lighting:
    position: true
    color: false
  ramp_orientation:
    enabled: true
    choices: [ 0,3.1416]   # bins to the robot's left (0) or right (pi)
  ramp_pose:               # rigid jitter of ramp, bins, fence and spawn box
    yaw_deg: 15            # extra yaw, uniform in [-15, 15] deg
    shift_xy: [0.03, 0.0]  # world shift, uniform per axis (the layout already spans the table's y)
  ball_layout:
    shuffle: true          # random positions along the spawn row and random colour order
    jitter: 0.008          # per-ball jitter across the row (m)

task:
  num_spheres: 1           # default starting count (overridden by range each reset)
  num_cubes: 1
  num_spheres_range: [1, 2]   # 1–2 blue + 1–3 red balls → total ∈ [2, 5]
  num_cubes_range:   [1, 3]   # "cubes" = the red balls (historical key name)
  object_size: 0.020
  ramp_angle_deg: 15
  bin_width: 0.08
  # Bin side (sphere=left/right) is randomized each reset automatically

task_conditions:
  success:
    score_threshold: 1.0
  failure:
    floor_z_threshold: 0.05

recording:
  save_freq:
    proprio: 100
    force_torque: 50
    object_state: 50
    cameras: 25
    tactile: 50
  save:
    action: true
    reward: true
    task_score: true
    joint_positions: true
    ee_poses: true

controller:
  type: OSC_POSE
  robot: Panda
  kp: 200
  damping_ratio: 1
  impedance_mode: fixed
  uncouple_pos_ori: true
  input_type: delta
  input_ref_frame: base

obs:
  proprio:
    enabled: true
    keys:
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
    - robot0_joint_pos
    - robot0_joint_vel
    save: true
  object_state:
    enabled: true
    save: true
  cameras:
    gripper_cam:
      enabled: true
      robosuite_name: robot0_eye_in_hand
      width: 640
      height: 480
      depth: false
      save: true
    exo_bird_cam:
      enabled: true
      robosuite_name: birdview
      width: 640
      height: 480
      depth: false
      save: true
  force_torque:
    enabled: true
    keys:
    - robot0_ft_sensor
    save: true
  tactile:
    enabled: true
    fingers:
    - right
    - left
    rows: 8
    cols: 8
    spacing: 0.001
    save: true
