task_id: ib-p3-gap-funnel-v1
description: >-
  Puzzle: a medium sphere sits on the robot's side of the table, a
  barrier strip blocks the far side except for one narrow gap, and a
  green goal zone waits beyond. Push the sphere through the gap into
  the goal zone.
max_episode_steps: 1300
reward_type: sparse
action_mode: cartesian_delta
control_freq: 100

scene:
  table:
    # Wider + deeper table, shifted in +X so the extra space extends
    # away from the robot (robot sits at world x ≈ -0.81, far table
    # edge at x = 0.70).
    full_size: [1.3, 0.8, 0.05]
    height: 0.8
    offset: [0.05, 0.0, 0.8]
  robot_offset: null

placement:
  center: null
  x_range: 0.0
  y_range: 0.0

randomization:
  object_color:
    enabled: false
  lighting:
    position: true
    color: false

task:
  # Sphere — ~6 cm diameter "medium" ball.
  ball_radius: 0.03
  ball_density: 400.0

  # Barrier strip: shifted further from the robot in +X. Strip runs
  # across the table in Y; the gap's Y position is randomized widely.
  # Spans the full table width so the gap is the only way past it.
  barrier_x: 0.15
  barrier_half_thickness: 0.012
  barrier_half_height: 0.03
  barrier_full_length: 0.80
  gap_half_width: 0.05
  gap_y_range: [-0.25, 0.25]

  # Rectangular green goal zone past the barrier, from the barrier's
  # back face out to goal_x_far, across ±goal_half_y.
  goal_x_far: 0.45
  goal_half_y: 0.35
  # Consecutive steps the sphere must rest on the table inside the zone.
  goal_hold_steps: 10

  # Sphere spawn rectangle, in the robot base's frame (the sphere is
  # placed at base_xy + (dx, dy) with dx ~ U(x_range), dy ~ U(y_range)).
  # 0.4–0.6 m in front of the arm, ±0.2 m laterally.
  spawn_region:
    x_range: [0.40, 0.60]
    y_range: [-0.20, 0.20]

task_conditions:
  success:
    score_threshold: 1.0
  failure:
    floor_z_threshold: 0.05

recording:
  save_freq:
    proprio: 100
    force_torque: 50
    object_state: 50
    cameras: 25
    tactile: 50
  save:
    action: true
    reward: true
    task_score: true
    joint_positions: true
    ee_poses: true

controller:
  type: OSC_POSE
  robot: Panda
  kp: 200
  damping_ratio: 1
  impedance_mode: fixed
  uncouple_pos_ori: true
  input_type: delta
  input_ref_frame: base

obs:
  proprio:
    enabled: true
    keys:
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
    - robot0_joint_pos
    - robot0_joint_vel
    save: true
  object_state:
    enabled: true
    save: true
  cameras:
    gripper_cam:
      enabled: true
      robosuite_name: robot0_eye_in_hand
      width: 640
      height: 480
      depth: false
      save: true
    exo_front_cam:
      enabled: true
      robosuite_name: frontview
      width: 640
      height: 480
      depth: false
      save: true
    exo_bird_cam:
      enabled: true
      robosuite_name: birdview
      width: 640
      height: 480
      depth: false
      save: true
  force_torque:
    enabled: true
    keys:
    - robot0_ft_sensor
    save: true
  tactile:
    enabled: true
    fingers:
    - right
    - left
    rows: 8
    cols: 8
    spacing: 0.001
    save: true
