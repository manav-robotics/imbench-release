task_id: ib-m-mirror-pick-place-v1
description: >-
  Single arm: pick up a cube lying on the table and lift it to a target
  height (default 0.08 m) while every camera image is mirrored
  (horizontally, vertically or both, fixed per episode). Cube position
  and color are randomized each reset. Success when the cube is held in
  the gripper with its centre lifted the target height above its resting
  height; sparse reward — 1.0 on success, 0.0 otherwise.
max_episode_steps: 1000
reward_type: sparse
action_mode: cartesian_delta
control_freq: 100

# ── Scene geometry ─────────────────────────────────────────────────
scene:
  table:
    full_size: [0.8, 0.8, 0.05]
    height: 0.8
    offset: null
  robot_offset: null

# ── Object placement bounds (meters from table center) ─────────────
placement:
  center: null
  x_range: 0.15
  y_range: 0.15

# ── Domain randomization (re-sampled every reset) ─────────────────
randomization:
  object_color:
    enabled: true
  lighting:
    position: false
    color: false

# ── Task-specific parameters ───────────────────────────────────────
task:
  cube_size: 0.02
  cube_mass: 0.05
  # Every camera image uses one fixed transform per episode; actions stay
  # in the world-coordinate frame. There is no unmirrored view.
  mirror_directions: [horizontal, vertical, both]
  lift_height: 0.08   # m, cube centre above its resting height

task_conditions:
  success:
    score_threshold: 1.0
  failure:
    floor_z_threshold: 0.05

recording:
  save_freq:
    proprio: 100
    force_torque: 50
    object_state: 50
    cameras: 25
    tactile: 50
  save:
    action: true
    reward: true
    task_score: true
    joint_positions: true
    ee_poses: true

controller:
  type: OSC_POSE
  robot: Panda
  kp: 200
  damping_ratio: 1
  impedance_mode: fixed
  uncouple_pos_ori: true
  input_type: delta
  input_ref_frame: base

obs:
  proprio:
    enabled: true
    keys:
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
    - robot0_joint_pos
    - robot0_joint_vel
    save: true
  object_state:
    enabled: true
    save: true
  cameras:
    gripper_cam:
      enabled: true
      robosuite_name: robot0_eye_in_hand
      width: 640
      height: 480
      depth: false
      save: true
    exo_front_cam:
      enabled: true
      robosuite_name: frontview
      width: 640
      height: 480
      depth: false
      save: true
  force_torque:
    enabled: true
    keys:
    - robot0_ft_sensor
    save: true
  tactile:
    enabled: true
    fingers:
    - right
    - left
    rows: 8
    cols: 8
    spacing: 0.001
    save: true
