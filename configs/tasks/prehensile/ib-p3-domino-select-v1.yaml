task_id: ib-p3-domino-select-v1
description: >-
  Single arm: find the one domino route that topples red. Each episode
  draws one of 27 layouts (zig-zags, loops, junctions, crossings, ladders)
  whose look-alike chains stop at hidden breaks, meet other chains
  side-on, or end beside or short of red.
max_episode_steps: 1000
reward_type: sparse
action_mode: cartesian_delta
control_freq: 100

# ── Scene geometry ─────────────────────────────────────────────────
scene:
  table:
    full_size: [0.8, 0.8, 0.05]
    height: 0.8
    offset: null
  robot_offset: null

# Initial placement sampler (read by SingleArmBase); reset() then places
# every object explicitly.
placement:
  center: null
  x_range: 0.30
  y_range: 0.30

# ── Domain randomization (re-sampled every reset) ─────────────────
randomization:
  object_color:
    enabled: true
  lighting:
    position: true
    color: false
  # Layouts drawn per episode (domino_layouts.PATTERNS); empty = all of them.
  layout_patterns: []
  # pattern, interconnections and the shape/interruption switches apply to
  # the merge and lanes layouts; size_probability applies to every layout.
  pattern:
    enabled: true
    types: ["line", "arc", "bend"]
  layout_variations:
    shape_probability: 0.75
    size_probability: 0.65
    interruption_probability: 0.65

# ── Task-specific parameters ───────────────────────────────────────
task:
  layout: patterns
  # 8 x 6 = 48 pooled pieces; each layout uses up to all of them and parks the rest.
  num_chains: 8
  dominoes_per_chain: 6
  domino_size: [0.06, 0.03, 0.01]
  correct_spacing: 0.045
  chain_y_spacing: 0.145
  target_displacement_threshold: 0.05

task_conditions:
  success:
    score_threshold: 1.0
  failure:
    floor_z_threshold: 0.05

recording:
  save_freq:
    proprio: 100
    force_torque: 50
    object_state: 50
    cameras: 25
    tactile: 50
  save:
    action: true
    reward: true
    task_score: true
    joint_positions: true
    ee_poses: true

controller:
  type: OSC_POSE
  robot: Panda
  kp: 200
  damping_ratio: 1
  impedance_mode: fixed
  uncouple_pos_ori: true
  input_type: delta
  input_ref_frame: base

obs:
  proprio:
    enabled: true
    keys:
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
    - robot0_joint_pos
    - robot0_joint_vel
    save: true
  object_state:
    enabled: true
    save: true
  cameras:
    gripper_cam:
      enabled: true
      robosuite_name: robot0_eye_in_hand
      width: 640
      height: 480
      depth: false
      save: true
    exo_front_cam:
      enabled: true
      robosuite_name: frontview
      width: 640
      height: 480
      depth: false
      save: true
    exo_right_cam:
      enabled: true
      robosuite_name: agentview
      pos: [0.0, -0.9, 1.2]
      quat: [0.8254, 0.5646, 0.0, 0.0]
      fovy: 60
      width: 640
      height: 480
      depth: false
      save: true
    exo_left_cam:
      enabled: true
      robosuite_name: sideview
      pos: [0.0, 0.9, 1.2]
      quat: [0.0, 0.0, 0.5646, 0.8254]
      fovy: 60
      width: 640
      height: 480
      depth: false
      save: true
  force_torque:
    enabled: true
    keys:
    - robot0_ft_sensor
    save: true
  tactile:
    enabled: true
    fingers:
    - right
    - left
    rows: 8
    cols: 8
    spacing: 0.001
    save: true
