task_id: ib-p2-pendulum-grasp-v1
description: >-
  Single arm: grasp a sphere swinging on an ideal (undamped) pendulum
  within 1 cm of the swing apex.
max_episode_steps: 2000
reward_type: sparse
action_mode: cartesian_delta
control_freq: 100

# ── Scene geometry ─────────────────────────────────────────────────
scene:
  table:
    full_size: [0.5, 0.5, 0.05]
    height: 0.8
    offset: null
  robot_offset: null

# Initial placement sampler (read by SingleArmBase); reset() then places
# every object explicitly.
placement:
  center: null
  x_range: 0.12
  y_range: 0.12

# ── Domain randomization (re-sampled every reset) ─────────────────
randomization:
  object_color:
    enabled: true
  lighting:
    position: true
    color: false
  pendulum:
    pendulum_length:       [0.50, 0.80]   # metres (longer = slower swing)
    pendulum_damping:      [0.0,  0.0]    # ideal pendulum
    frame_height:          [0.65, 0.95]   # metres; sampled subject to bob-surface clearance
    bob_size:              [0.015, 0.022] # sphere radius metres

# ── Task-specific parameters ───────────────────────────────────────
task:
  # Reach is bounded jointly with length: large angles occur on shorter rods.
  swing_amplitude_range: [12, 35]
  max_swing_offset: 0.30  # maximum lateral bob-centre distance from the pivot
  randomize_release_side: true
  bob_shape: sphere
  pendulum_damping: 0.0

task_conditions:
  success:
    score_threshold: 1.0
  failure:
    floor_z_threshold: 0.05

recording:
  save_freq:
    proprio: 100
    force_torque: 50
    object_state: 50
    cameras: 25
    tactile: 50
  save:
    action: true
    reward: true
    task_score: true
    joint_positions: true
    ee_poses: true

controller:
  type: OSC_POSE
  robot: Panda
  kp: 200
  damping_ratio: 1
  impedance_mode: fixed
  uncouple_pos_ori: true
  input_type: delta
  input_ref_frame: base

obs:
  proprio:
    enabled: true
    keys:
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
    - robot0_joint_pos
    - robot0_joint_vel
    save: true
  object_state:
    enabled: true
    save: true
  cameras:
    gripper_cam:
      enabled: true
      robosuite_name: robot0_eye_in_hand
      width: 640
      height: 480
      depth: false
      save: true
    exo_front_cam:
      enabled: true
      robosuite_name: frontview
      width: 640
      height: 480
      depth: false
      save: true
    exo_right_cam:
      enabled: true
      robosuite_name: agentview
      pos: [0.0, -0.9, 1.2]
      quat: [0.8254, 0.5646, 0.0, 0.0]
      fovy: 60
      width: 640
      height: 480
      depth: false
      save: true
    exo_left_cam:
      enabled: true
      robosuite_name: sideview
      pos: [0.0, 0.9, 1.2]
      quat: [0.0, 0.0, 0.5646, 0.8254]
      fovy: 60
      width: 640
      height: 480
      depth: false
      save: true
  force_torque:
    enabled: true
    keys:
    - robot0_ft_sensor
    save: true
  tactile:
    enabled: true
    fingers:
    - right
    - left
    rows: 8
    cols: 8
    spacing: 0.001
    save: true
